<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demand Plan View</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    color: #1a1a1a;
    background: #ffffff;
  }
  .state {
    padding: 24px;
    text-align: center;
    color: #666;
  }
  .state.error { color: #b91c1c; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header h2 { margin: 0; font-size: 16px; }
  .status {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 12px;
  }
  .status-ok { background: #dcfce7; color: #166534; }
  .status-low { background: #fee2e2; color: #991b1b; }

  table.loc-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
    font-size: 13px;
  }
  table.loc-table th,
  table.loc-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
  }
  table.loc-table th {
    background: #f3f4f6;
    font-weight: 600;
    color: #374151;
  }
  table.loc-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.loc-table td.empty { text-align: center; color: #9ca3af; }

  .summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .summary-item {
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
    background: #f9fafb;
    border-radius: 8px;
  }
  .summary-item.highlight {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
  }
  .summary-item .label {
    font-size: 11px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .summary-item .value {
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #e5e5e5; }
    table.loc-table th { background: #262626; color: #d1d5db; }
    table.loc-table th, table.loc-table td { border-bottom-color: #333; }
    .summary-item { background: #262626; }
    .summary-item.highlight { background: #1e293b; border-color: #334155; }
    .summary-item .label { color: #9ca3af; }
    .status-ok { background: #14532d; color: #bbf7d0; }
    .status-low { background: #7f1d1d; color: #fecaca; }
    .chart-wrap { background: #1f1f1f; }
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #6b7280;
    margin: 20px 0 8px;
  }
  .chart-wrap {
    background: #fafafa;
    border-radius: 8px;
    padding: 8px;
  }
  .projection-svg {
    width: 100%;
    height: 130px;
    display: block;
  }
  .balance-line { fill: none; stroke: #2563eb; stroke-width: 2; }
  .reorder-line { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .olt-line { stroke: #a855f7; stroke-width: 1.5; stroke-dasharray: 2 3; }
  .arrival-dot { fill: #16a34a; }

  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    color: #6b7280;
    margin: 6px 0 4px;
  }
  .chart-legend .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }
  .dot.balance { background: #2563eb; }
  .dot.reorder { background: #f59e0b; }
  .dot.olt { background: #a855f7; }
  .dot.arrival { background: #16a34a; }

  .arrivals-table { margin-top: 6px; }
  .decision-summary { margin-top: 12px; }
  .empty { color: #9ca3af; font-size: 12px; padding: 8px 0; }
</style>
</head>
